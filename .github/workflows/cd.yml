name: Continuous Delivery

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t devops-node-app:${{ github.sha }} .

      - name: Testar container (smoke test)
        run: |
          docker run -d -p 3000:3000 --name app-test devops-node-app:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:3000/health
          docker stop app-test

  # ---------------------------------------------------------------
  # DESAFIO: publicar a imagem no Docker Hub.
  # Secrets necessários (Settings > Secrets and variables > Actions):
  # DOCKERHUB_USERNAME e DOCKERHUB_TOKEN
  # ---------------------------------------------------------------
  docker-publish:
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-node-app:latest
